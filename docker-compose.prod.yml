# PostgreSQL + pgvector untuk PRODUKSI di VPS.
# Beda dari docker-compose.yml (dev):
#   - Port hanya di-bind ke 127.0.0.1 (tidak terekspos ke internet).
#   - Password diambil dari env host (POSTGRES_PASSWORD), bukan hardcode.
# Jalankan: POSTGRES_PASSWORD=xxx docker compose -f docker-compose.prod.yml up -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: diajar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: diajar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: diajar_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - diajar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diajar -d diajar_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  diajar_db_data:
